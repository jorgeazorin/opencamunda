# =============================================================================
# values-camunda-helm.yaml
# =============================================================================
# Use this file with the OFFICIAL Camunda Platform Helm chart (v8.5.x)
# to deploy using your custom OpenCamunda Docker image.
#
# Usage:
#   helm repo add camunda https://helm.camunda.io
#   helm install opencamunda camunda/camunda-platform \
#     --version 10.x.x \
#     -f helm/values-camunda-helm.yaml
#
# First, push your image to a registry:
#   docker build -t your-registry.com/opencamunda/zeebe:8.5.25 .
#   docker push your-registry.com/opencamunda/zeebe:8.5.25
# =============================================================================

global:
  image:
    # Set your private registry here
    registry: ""
    tag: "8.5.25"
  identity:
    auth:
      enabled: false

# Zeebe Broker - uses YOUR custom image
zeebe:
  enabled: true
  image:
    # Point to your custom-built OpenCamunda image
    repository: opencamunda/zeebe
    tag: "8.5.25"
  clusterSize: "1"
  partitionCount: "1"
  replicationFactor: "1"
  pvcSize: "10Gi"
  resources:
    requests:
      cpu: 800m
      memory: 1200Mi
    limits:
      cpu: 960m
      memory: 1920Mi

# Gateway - uses the SAME custom image (same binary, different mode)
zeebeGateway:
  image:
    repository: opencamunda/zeebe
    tag: "8.5.25"
  replicas: 1
  resources:
    requests:
      cpu: 400m
      memory: 450Mi
    limits:
      cpu: 400m
      memory: 450Mi

# Elasticsearch - keep the standard Bitnami chart
elasticsearch:
  enabled: true
  master:
    masterOnly: false
    heapSize: 1024m
    persistence:
      size: "30Gi"
    resources:
      requests:
        cpu: 1
        memory: 2Gi
      limits:
        cpu: 2
        memory: 2Gi

# Disable components that are NOT part of this fork
# (Operate, Tasklist, etc. are closed-source Camunda products)
operate:
  enabled: false
tasklist:
  enabled: false
optimize:
  enabled: false
identity:
  enabled: false
identityKeycloak:
  enabled: false
connectors:
  enabled: false
console:
  enabled: false
webModeler:
  enabled: false
postgresql:
  enabled: false
